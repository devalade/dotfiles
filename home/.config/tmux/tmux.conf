set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g history-limit 10000

set -g mouse on
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g status-interval 1
set -g status on
set -g status-position top
set -g status-left-length 100
set -g status-right-length 120
set -g status-left "#[fg=colour235,bg=colour254,bold] #S #[fg=colour254,bg=colour235,nobold]"
set -g status-right "#[fg=colour235,bg=colour254] %H:%M:%S #[fg=colour235,bg=colour254,bold] #h "
set -g status-style bg=colour235,fg=colour252
set -g window-status-separator ""
set -g window-status-format "#[fg=colour108,bg=colour236]  #W  "
set -g window-status-current-format "#[fg=colour22,bg=colour120,bold]  #W  "

setw -g window-status-style fg=colour108,bg=colour236
setw -g window-status-current-style fg=colour22,bg=colour120,bold
setw -g window-status-activity-style fg=colour120,bg=colour236,bold

set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour254

# Windows are tmux "tabs".
bind n new-window -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r command-prompt -p "Rename window:" "rename-window '%%'"
bind Tab next-window
bind BTab previous-window

# Splits keep the current folder.
# Prefix + | = side-by-side, Prefix + - = top/bottom.
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
unbind v
bind v split-window -h -c "#{pane_current_path}"
unbind '"'
bind '"' split-window -v -c "#{pane_current_path}"
unbind %
bind % split-window -h -c "#{pane_current_path}"

# Pane navigation and resizing.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -n M-1 select-window -t :0
bind -n M-2 select-window -t :1
bind -n M-3 select-window -t :2
bind -n M-4 select-window -t :3
bind -n M-5 select-window -t :4
bind -n M-6 select-window -t :5
bind -n M-7 select-window -t :6
bind -n M-8 select-window -t :7
bind -n M-9 select-window -t :8
bind -n M-0 select-window -t :9
bind R source-file ~/.tmux.conf \; display "Config reloaded"
bind -n M-Tab select-window -t :+
bind -n M-S-Tab select-window -t :-

set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
