name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stow and shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq stow shellcheck

      - name: Bash syntax
        run: |
          bash -n dot
          bash -n home/.agents/sync-skills.sh
          bash -n home/.agents/skills-lib.sh

      - name: Shellcheck (errors only)
        run: |
          shellcheck --severity=error dot
          shellcheck --severity=error home/.agents/sync-skills.sh
          shellcheck --severity=error home/.agents/skills-lib.sh

      - name: Stow tree has no conflicts
        run: |
          target="$(mktemp -d)"
          stow -n -v -d . -t "$target" home > stow.out 2>&1
          if grep -qE 'cannot stow|not owned' stow.out; then
            cat stow.out
            exit 1
          fi

      - name: JSON configs parse
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = [
              *glob.glob("home/.t3/userdata/*.json"),
              "home/.pi/skills-lock.json",
              "home/.pi/package.json",
          ]
          bad = []
          for f in files:
              try:
                  json.load(open(f))
              except Exception as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print(f"{len(files)} JSON files OK")
          PY

      - name: No secrets committed
        run: |
          if git grep -InE 'sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH) PRIVATE KEY' -- . ':!*.md'; then
            echo "Possible secret found"
            exit 1
          fi
